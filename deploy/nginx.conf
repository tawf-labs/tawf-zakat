# Nginx Reverse Proxy Configuration for Tawf Zakat Protocol
# Place this file in /etc/nginx/sites-available/tawf-zakat and symlink to /etc/nginx/sites-enabled/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name zakat.yourdomain.com; # Replace with your domain or VPS public IP

    # Redirect all HTTP traffic to HTTPS (enable after SSL setup via Certbot)
    # return 301 https://$host$request-uri;

    # Maximum file upload size (for BAST scan PDFs, photos, audit reports)
    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript;

    # 1. Real-Time WebSocket Endpoint (/ws)
    location /ws {
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-lived WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. REST API Endpoints (/api/)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Frontend Web Application (Nitro / Static SPA)
    location / {
        # Option A: If running Frontend via Nitro SSR server on port 3000
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Option B: If serving static build directly:
        # root /var/www/tawf-zakat/frontend/.output/public;
        # try_files $uri $uri/ /index.html;
    }
}
