[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.31"
optimizer = true
optimizer_runs = 1
via_ir = true

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@tawf-gov/=lib/tawf-gov/gov/src/",
]

# RPC endpoints
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "https://sepolia.base.org"
lisk_sepolia = "https://rpc.sepolia-api.lisk.com"
# celo_sepolia = "https://celo-sepolia.drpc.org"
celo_sepolia = "https://forno.celo-sepolia.celo-testnet.org"
ethiq_sepolia = "wss://rpc.testethiq.haqq.network"

[etherscan]
# Ethereum Sepolia (11155111) is the chain this project actually deploys to.
# Without this key `forge script --verify --rpc-url sepolia` cannot verify.
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111, url = "https://api.etherscan.io/v2/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api" }
lisk_sepolia = { key = "${LISKSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api" }
celo_sepolia = { key = "${CELOSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api" }    
ethiq_sepolia = { key = "${ETHIQ_API_KEY}", url = "https://api.etherscan.io/v2/api" }
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
