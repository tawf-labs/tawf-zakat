[package]
name = "zkt_core"
version = "0.1.0"
edition = "2021"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
]

[lib]
crate-type = ["cdylib"]

[features]
alloc = []
client = []
debug = []
idl-build = ["quasar-lang/idl-build"]

[dependencies]
# Pinned per ADR-0001: Quasar has no releases; rev = master @ 2026-05-31
quasar-lang = { git = "https://github.com/blueshift-gg/quasar", rev = "a89a9329f05740a20520607608b2b3b78c74f7c4" }
quasar-spl = { git = "https://github.com/blueshift-gg/quasar", rev = "a89a9329f05740a20520607608b2b3b78c74f7c4" }
solana-instruction = { version = "3.2.0" }
# Raw alt_bn128 syscall declarations (no_std) for the on-chain Groth16 verifier
# (src/groth16.rs). Matches Quasar's own syscall linkage. See ADR-0004.
solana-define-syscall = { version = "5", features = ["unstable-static-syscalls"] }

# On the HOST target only (tests/codegen), pull solana-bn254 to emulate the
# alt_bn128 syscalls via arkworks. It is a `std` crate, so it must NOT reach the
# SBF build (target_os = "solana") — that would clash with Quasar's no_std panic
# handler (the ADR-0004 blocker). Target-gating keeps it off-chain only.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-bn254 = { version = "3.2.1" }

[dev-dependencies]
quasar-svm = { version = "0.1" }
zkt_core-client = { path = "target/client/rust/zkt_core-client" }
wincode = { version = "0.4", features = ["derive"] }
spl-token-interface = { version = "2.0.0" }
solana-account = { version = "3.4.0" }
solana-address = { version = "2.2.0", features = ["decode"] }
solana-instruction = { version = "3.2.0", features = ["bincode"] }
solana-pubkey = { version = "4.1.0" }
